(function(){

  try{ muted = localStorage.getItem(KEY)==='1'; }catch(e){}
  /* 讓這個遊戲建立的所有 Web Audio 聲音，都先經過一個總音量；靜音＝總音量 0 */
  try{
    var BP = window.BaseAudioContext ? window.BaseAudioContext.prototype : (window.AudioContext||window.webkitAudioContext).prototype;
    var desc = Object.getOwnPropertyDescriptor(BP,'destination');
    if(desc && desc.get){
      Object.defineProperty(BP,'destination',{configurable:true,get:function(){
        var real = desc.get.call(this);
        if(!this.__hgMaster){
          try{ var g=this.createGain(); g.gain.value = muted?0:1; g.connect(real); this.__hgMaster=g; masters.push(g); }
          catch(e){ return real; }
        }
        return this.__hgMaster;
      }});
    }
  }catch(e){}
  /* 備用的 <audio> 播放（例如 iPhone 的 Chrome）也一起靜音 */
  try{
    var op = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function(){ this.muted = muted; return op.apply(this, arguments); };
  }catch(e){}
  function apply(){ masters.forEach(function(g){ try{ g.gain.setValueAtTime(muted?0:1, g.context.currentTime); }catch(e){ g.gain.value = muted?0:1; } }); }
  function build(){
    if(document.getElementById('hgMute')) return;
    var st=document.createElement('style');
    st.textContent='#hgMute{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.88);color:#222;font-size:19px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}#hgMute:active{transform:scale(.94)}#hgMute.st{position:static;flex:0 0 40px;margin:0 0 0 8px}';
    document.head.appendChild(st);
    var b=document.createElement('button'); b.type='button'; b.id='hgMute';
    function paint(){ b.textContent = muted?'🔇':'🔊'; b.setAttribute('aria-pressed', muted?'true':'false');

    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    paint();
    var anchor = MOUNT && document.querySelector(MOUNT);
    if(anchor && anchor.parentNode){ b.className='st'; anchor.parentNode.insertBefore(b, anchor.nextSibling); } else document.body.appendChild(b);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- 1. 切房間（一刀一刀切） ---------- */
function partition(r){
  const MIN=6; let rects=[{x0:1,y0:1,x1:COLS-2,y1:ROWS-2}], guard=0;
  while(rects.length<6 && guard++<100){
    const cand=rects.filter(a=>(a.x1-a.x0+1)>=2*MIN+1||(a.y1-a.y0+1)>=2*MIN+1);
    if(!cand.length) return null;
    let t=r()*cand.reduce((s,a)=>s+area(a),0), pick=cand[0];
    for(const a of cand){ t-=area(a); if(t<=0){pick=a;break;} }
    const w=pick.x1-pick.x0+1, h=pick.y1-pick.y0+1, canV=w>=2*MIN+1, canH=h>=2*MIN+1;
    const vert=(canV&&canH)?r()<w/(w+h):canV;
    let A,B;
    if(vert){ const c=rint(r,pick.x0+MIN,pick.x1-MIN); A={...pick,x1:c-1}; B={...pick,x0:c+1}; }
    else { const c=rint(r,pick.y0+MIN,pick.y1-MIN); A={...pick,y1:c-1}; B={...pick,y0:c+1}; }
    rects=rects.filter(x=>x!==pick).concat([A,B]);
  }
  if(rects.length!==6) return null;
  if(rects.some(a=>area(a)>115)) return null;
  if(rects.some(a=>Math.max(a.x1-a.x0+1,a.y1-a.y0+1)/Math.min(a.x1-a.x0+1,a.y1-a.y0+1)>2.4)) return null;
  return rects;
}
// 兩間房隔著一道牆時，可以開門的位置
function adjInfo(A,B){
  const c=[];
  if(A.x1+2===B.x0){ for(let y=Math.max(A.y0,B.y0);y<=Math.min(A.y1,B.y1);y++) c.push({x:A.x1+1,y,a:{x:A.x1,y},b:{x:B.x0,y}}); }
  else if(B.x1+2===A.x0){ for(let y=Math.max(A.y0,B.y0);y<=Math.min(A.y1,B.y1);y++) c.push({x:B.x1+1,y,a:{x:A.x0,y},b:{x:B.x1,y}}); }
  else if(A.y1+2===B.y0){ for(let x=Math.max(A.x0,B.x0);x<=Math.min(A.x1,B.x1);x++) c.push({x,y:A.y1+1,a:{x,y:A.y1},b:{x,y:B.y0}}); }
  else if(B.y1+2===A.y0){ for(let x=Math.max(A.x0,B.x0);x<=Math.min(A.x1,B.x1);x++) c.push({x,y:B.y1+1,a:{x,y:A.y0},b:{x,y:B.y1}}); }
  return c;
}

/* ---------- 2. 決定哪間是什麼房間（要有生活邏輯） ---------- */
function assign(r,rects){
  const touch=a=>a.x0===1||a.y0===1||a.x1===COLS-2||a.y1===ROWS-2;
  const adj=rects.map((a,i)=>rects.map((b,j)=>i===j?0:adjInfo(a,b).length));
  const types=['living','kitchen','bed','bath','study','balcony'];
  let best=null,bs=-1e9; const perm=[],used=Array(6).fill(false);
  function score(){
    const idx={}; perm.forEach((t,i)=>idx[t]=i);
    const R=t=>rects[idx[t]], A=t=>area(R(t)), nb=(s,t)=>adj[idx[s]][idx[t]]>0;
    let s=0;
    if(!touch(R('living'))) s-=1000;            // 客廳要靠外牆（玄關在這）
    if(!touch(R('balcony'))) s-=1000;           // 陽台一定在外牆
    s+=A('living')*0.25; if(A('living')<48) s-=40;
    s+=nb('kitchen','living')?25:-12;           // 廚房靠客廳
    s+=A('bed')*0.12; if(nb('bed','bath')) s+=8; if(nb('bed','living')) s+=4;
    s-=A('bath')*0.2; if(nb('bath','bed')||nb('bath','living')) s+=5;
    if(nb('kitchen','bath')) s-=6;
    s+=(nb('balcony','living')||nb('balcony','bed'))?15:-10;   // 陽台接客廳或臥室
    const b=R('balcony'), bw=b.x1-b.x0+1, bh=b.y1-b.y0+1;
    if(Math.max(bw,bh)/Math.min(bw,bh)>=1.4) s+=5; s-=A('balcony')*0.1;
    s+=A('kitchen')*0.05;
    return s+r()*10;
  }
  (function rec(i){
    if(i===6){ const s=score(); if(s>bs){bs=s;best=perm.slice();} return; }
    for(let t=0;t<6;t++) if(!used[t]){used[t]=true;perm[i]=types[t];rec(i+1);used[t]=false;}
  })(0);
  if(bs<-500) return null;
  const out={}; best.forEach((t,i)=>out[t]=rects[i]); return out;
}

/* ---------- 3. 開門、開玄關、窗戶 ---------- */
function buildHouse(r,asg){
  const H={grid:[],occ:[],res:[],rects:asg,doors:[],furn:{},spots:{},spotIndex:{},entrance:null,start:null};
  for(let y=0;y<ROWS;y++){ H.grid[y]=[];H.occ[y]=[];H.res[y]=[]; for(let x=0;x<COLS;x++){H.grid[y][x]={k:'wall',room:null};H.occ[y][x]=null;H.res[y][x]=false;} }
  const ids=Object.keys(asg);
  ids.forEach(id=>{const a=asg[id];for(let y=a.y0;y<=a.y1;y++)for(let x=a.x0;x<=a.x1;x++)H.grid[y][x]={k:'floor',room:id};});
  const edges=[];
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const c=adjInfo(asg[ids[i]],asg[ids[j]]); if(c.length) edges.push({a:ids[i],b:ids[j],cells:c});}
  const reserve=(s,dx,dy)=>{ for(let k=0;k<2;k++){const x=s.x+dx*k,y=s.y+dy*k; if(H.grid[y]&&H.grid[y][x]&&H.grid[y][x].k==='floor')H.res[y][x]=true;} };
  const addDoor=e=>{
    const L=e.cells.length, pool=L>=3?e.cells.slice(1,L-1):e.cells, c=rpick(r,pool);
    H.grid[c.y][c.x]={k:'door',room:null};
    H.doors.push({x:c.x,y:c.y,a:e.a,b:e.b});
    reserve(c.a,Math.sign(c.a.x-c.x),Math.sign(c.a.y-c.y));
    reserve(c.b,Math.sign(c.b.x-c.x),Math.sign(c.b.y-c.y));
  };
  // 從客廳出發，一間一間接起來
  const conn=new Set(['living']), usedE=new Set();
  while(conn.size<ids.length){
    const opts=edges.filter(e=>conn.has(e.a)!==conn.has(e.b));
    if(!opts.length) return null;
    const w=opts.map(e=>((e.a==='living'||e.b==='living')?3:1)*(e.cells.length>=2?1:0.4));
    let t=r()*w.reduce((s,x)=>s+x,0), k=0; for(;k<opts.length-1;k++){t-=w[k];if(t<=0)break;}
    const e=opts[k]; addDoor(e); usedE.add(e); conn.add(e.a);conn.add(e.b);
  }
  // 多開一扇門，讓動線可以繞圈
  const extra=edges.filter(e=>!usedE.has(e)&&e.cells.length>=3);
  if(extra.length&&r()<0.5) addDoor(rpick(r,extra));
  // 玄關：開在客廳靠外牆的那一面
  const Lr=asg.living, ent=[];
  if(Lr.x0===1) for(let y=Lr.y0+1;y<Lr.y1;y++) ent.push({wx:0,wy:y,ix:1,iy:y,dx:1,dy:0});
  if(Lr.x1===COLS-2) for(let y=Lr.y0+1;y<Lr.y1;y++) ent.push({wx:COLS-1,wy:y,ix:COLS-2,iy:y,dx:-1,dy:0});
  if(Lr.y0===1) for(let x=Lr.x0+1;x<Lr.x1;x++) ent.push({wx:x,wy:0,ix:x,iy:1,dx:0,dy:1});
  if(Lr.y1===ROWS-2) for(let x=Lr.x0+1;x<Lr.x1;x++) ent.push({wx:x,wy:ROWS-1,ix:x,iy:ROWS-2,dx:0,dy:-1});
  if(!ent.length) return null;
  const e=rpick(r,ent);
  H.grid[e.wy][e.wx]={k:'door',room:null,ent:true};
  reserve({x:e.ix,y:e.iy},e.dx,e.dy);
  H.entrance={x:e.wx,y:e.wy,ix:e.ix,iy:e.iy}; H.start={x:e.ix,y:e.iy};
  // 外牆：陽台是欄杆，其他房間隨機開窗
  let lastWin=-9;
  const edge=(wx,wy,ix,iy,k)=>{
    const c=H.grid[wy][wx], f=H.grid[iy][ix]; if(c.k!=='wall'||f.k!=='floor') return;
    if(f.room==='balcony'){c.rail=true;return;}
    if(k-lastWin>=3&&r()<0.5){c.win=true;lastWin=k;}
  };
  for(let x=1;x<COLS-1;x++){edge(x,0,x,1,x);} lastWin=-9;
  for(let x=1;x<COLS-1;x++){edge(x,ROWS-1,x,ROWS-2,x);} lastWin=-9;
  for(let y=1;y<ROWS-1;y++){edge(0,y,1,y,y);} lastWin=-9;
  for(let y=1;y<ROWS-1;y++){edge(COLS-1,y,COLS-2,y,y);}
  return H;
}

/* ---------- 4. 擺家具 ---------- */
const inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
function dims(sp,d){return (d==='S'||d==='N')?[sp.w,sp.h]:[sp.h,sp.w];}
function footFree(H,room,x,y,fw,fh){
  for(let j=y;j<y+fh;j++)for(let i=x;i<x+fw;i++){
    if(!inB(i,j))return false; const c=H.grid[j][i];
    if(c.k!=='floor'||c.room!==room||H.occ[j][i]||H.res[j][i])return false;
  } return true;
}
function backTiles(x,y,fw,fh,d){
  const o=[];
  if(d==='S')for(let i=x;i<x+fw;i++)o.push([i,y-1]);
  if(d==='N')for(let i=x;i<x+fw;i++)o.push([i,y+fh]);
  if(d==='E')for(let j=y;j<y+fh;j++)o.push([x-1,j]);
  if(d==='W')for(let j=y;j<y+fh;j++)o.push([x+fw,j]);
  return o;
}
function frontOf(x,y,fw,fh,d){
  const o=[];
  if(d==='S')for(let i=x;i<x+fw;i++)o.push([i,y+fh]);
  if(d==='N')for(let i=x;i<x+fw;i++)o.push([i,y-1]);
  if(d==='E')for(let j=y;j<y+fh;j++)o.push([x+fw,j]);
  if(d==='W')for(let j=y;j<y+fh;j++)o.push([x-1,j]);
  return o;
}
const isFree=(H,room,i,j)=>inB(i,j)&&H.grid[j][i].k==='floor'&&H.grid[j][i].room===room&&!H.occ[j][i];
function gapOk(H,x,y,fw,fh){
  for(let j=y-1;j<=y+fh;j++)for(let i=x-1;i<=x+fw;i++){ if(i>=x&&i<x+fw&&j>=y&&j<y+fh)continue; if(inB(i,j)&&H.occ[j][i])return false; }
  return true;
}
function commit(H,room,id,x,y,d){
  const [fw,fh]=dims(FSPEC[id],d);
  for(let j=y;j<y+fh;j++)for(let i=x;i<x+fw;i++)H.occ[j][i]=id;
  H.furn[id]={id,room,x,y,w:fw,h:fh,dir:d};
}
function wallCands(H,room,id,gap){
  const R=H.rects[room], sp=FSPEC[id], out=[];
  for(const d of ['S','N','E','W']){
    const [fw,fh]=dims(sp,d);
    for(let y=R.y0;y<=R.y1-fh+1;y++)for(let x=R.x0;x<=R.x1-fw+1;x++){
      if(!footFree(H,room,x,y,fw,fh))continue;
      if(!backTiles(x,y,fw,fh,d).every(([i,j])=>inB(i,j)&&H.grid[j][i].k==='wall'))continue;
      if(!frontOf(x,y,fw,fh,d).some(([i,j])=>isFree(H,room,i,j)))continue;
      if(gap&&!gapOk(H,x,y,fw,fh))continue;
      out.push({x,y,d});
    }
  } return out;
}
function putWall(r,H,room,id,gap){
  const c=wallCands(H,room,id,gap); if(!c.length)return false;
  const p=rpick(r,c); commit(H,room,id,p.x,p.y,p.d); return true;
}
// 沙發面對電視，中間放茶几，沙發後面留走道
function putSofaTea(r,H,room,gap){
  const tv=H.furn.tv, sd=OPP[tv.dir], sp=FSPEC.sofa, [sw,sh]=dims(sp,sd);
  for(const dist of rshuf(r,[4,5])){
    const lat=rshuf(r,[-1,0,-2,1]);
    for(const off of lat){
      let sx,sy;
      if(tv.dir==='S'||tv.dir==='N'){ sx=tv.x+off; sy=tv.dir==='S'?tv.y+dist:tv.y-dist; }
      else { sy=tv.y+off; sx=tv.dir==='E'?tv.x+dist:tv.x-dist; }
      if(!footFree(H,room,sx,sy,sw,sh))continue;
      if(!backTiles(sx,sy,sw,sh,sd).every(([i,j])=>isFree(H,room,i,j)))continue;   // 沙發後面要有路
      if(gap&&!gapOk(H,sx,sy,sw,sh))continue;
      // 茶几放在中間
      const mids=[]; for(let m=2;m<=dist-2;m++)mids.push(m);
      for(const m of rshuf(r,mids)){
        for(const toff of rshuf(r,[0,1])){
          let tx,ty;
          if(tv.dir==='S'||tv.dir==='N'){ tx=sx+toff; ty=tv.dir==='S'?tv.y+m:tv.y-m; }
          else { ty=sy+toff; tx=tv.dir==='E'?tv.x+m:tv.x-m; }
          const [tw,th]=dims(FSPEC.tea,sd);
          commit(H,room,'sofa',sx,sy,sd);
          if(footFree(H,room,tx,ty,tw,th)){ commit(H,room,'tea',tx,ty,sd); return true; }
          clearPiece(H,'sofa');
        }
      }
    }
  } return false;
}
function clearPiece(H,id){const F=H.furn[id]; if(!F)return; for(let j=F.y;j<F.y+F.h;j++)for(let i=F.x;i<F.x+F.w;i++)H.occ[j][i]=null; delete H.furn[id];}
function putNstand(r,H,room){
  const B=H.furn.bedf, d=B.dir; let c;
  if(d==='S') c=[[B.x-1,B.y],[B.x+B.w,B.y]];
  if(d==='N') c=[[B.x-1,B.y+B.h-1],[B.x+B.w,B.y+B.h-1]];
  if(d==='E') c=[[B.x,B.y-1],[B.x,B.y+B.h]];
  if(d==='W') c=[[B.x+B.w-1,B.y-1],[B.x+B.w-1,B.y+B.h]];
  c=rshuf(r,c).filter(([x,y])=>footFree(H,room,x,y,1,1)&&backTiles(x,y,1,1,d).every(([i,j])=>inB(i,j)&&H.grid[j][i].k==='wall'));
  if(!c.length)return false; commit(H,room,'nstand',c[0][0],c[0][1],d); return true;
}
function putChairS(r,H,room){

const PLACERS={

// 家具旁邊可以站的格子：前面／旁邊／後面
function spotsOf(F,ok){
  const x0=F.x,y0=F.y,x1=F.x+F.w-1,y1=F.y+F.h-1,s={front:[],side:[],back:[],left:[],right:[]};
  const add=(a,x,y)=>{if(ok(x,y))a.push({x,y});};
  if(F.dir==='S'||F.dir==='N'){
    for(let x=x0;x<=x1;x++){ add(s.front,x,F.dir==='S'?y1+1:y0-1); add(s.back,x,F.dir==='S'?y0-1:y1+1); }
    for(let y=y0;y<=y1;y++){ add(s.side,x0-1,y); add(s.side,x1+1,y); }
  } else {
    for(let y=y0;y<=y1;y++){ add(s.front,F.dir==='E'?x1+1:x0-1,y); add(s.back,F.dir==='E'?x0-1:x1+1,y); }
    for(let x=x0;x<=x1;x++){ add(s.side,x,y0-1); add(s.side,x,y1+1); }
  }
  // 左／右以地圖畫面為準（西＝左、東＝右），和家具朝哪裡無關
  for(let y=y0;y<=y1;y++){ add(s.left,x0-1,y); add(s.right,x1+1,y); }
  return s;
}
function reachFrom(H,sx,sy,roomOnly){
  const seen=new Set([sx+','+sy]), q=[[sx,sy]];
  while(q.length){
    const [x,y]=q.shift();
    for(const d of Object.values(DIRV)){
      const nx=x+d[0],ny=y+d[1],k=nx+','+ny; if(seen.has(k)||!inB(nx,ny))continue;
      const c=H.grid[ny][nx]; if(c.k==='wall'||H.occ[ny][nx])continue;
      if(roomOnly&&(c.k!=='floor'||c.room!==roomOnly))continue;
      seen.add(k);q.push([nx,ny]);
    }
  } return seen;
}
function needsOk(F,s){
  if(s.front.length+s.side.length+s.back.length<1)return false;
  const n=FNEEDS[F.id]; if(n){for(const p of n) if(!s[p].length)return false;}
  if(F.id==='sofa'&&!s.back.length)return false;
  return true;
}
function localOk(H,room){
  const ds=H.doors.filter(d=>d.a===room||d.b===room); let seed=null; const ins=[];
  const R=H.rects[room];
  H.doors.forEach(d=>{ if(d.a!==room&&d.b!==room)return;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const x=d.x+dx,y=d.y+dy; if(inB(x,y)&&H.grid[y][x].k==='floor'&&H.grid[y][x].room===room)ins.push([x,y]);}); });
  if(H.entrance&&H.grid[H.entrance.iy][H.entrance.ix].room===room)ins.push([H.entrance.ix,H.entrance.iy]);
  if(!ins.length)return false;
  const reach=reachFrom(H,ins[0][0],ins[0][1],room);
  if(!ins.every(([x,y])=>reach.has(x+','+y)))return false;
  const ok=(x,y)=>reach.has(x+','+y);
  return ROOM_PIECES[room].every(id=>H.furn[id]&&needsOk(H.furn[id],spotsOf(H.furn[id],ok)));
}
function clearRoom(H,room){const R=H.rects[room]; for(let y=R.y0;y<=R.y1;y++)for(let x=R.x0;x<=R.x1;x++)H.occ[y][x]=null; ROOM_PIECES[room].forEach(id=>delete H.furn[id]);}
function placeRoom(r,H,room){
  for(let a=0;a<60;a++){
    clearRoom(H,room);
    if(PLACERS[room](r,H,a<40)&&localOk(H,room))return true;
  } clearRoom(H,room); return false;
}
function finish(H){
  const reach=reachFrom(H,H.start.x,H.start.y,null);
  const ok=(x,y)=>H.grid[y][x].k==='floor'&&reach.has(x+','+y);
  for(const id in H.furn){
    const F=H.furn[id], s=spotsOf(F,ok);
    if(!needsOk(F,s))return false;
    H.spots[id]=s;
    ['front','side','back','left','right'].forEach(p=>s[p].forEach(t=>{(H.spotIndex[t.x+','+t.y]=H.spotIndex[t.x+','+t.y]||[]).push({f:id,pos:p});}));
  }
  return Object.keys(H.furn).length===24;
}
function genHouse(seed){
  const r=mulberry32(seed>>>0);
  for(let tries=1;tries<=300;tries++){
    const rects=partition(r); if(!rects)continue;
    const asg=assign(r,rects); if(!asg)continue;
    const H=buildHouse(r,asg); if(!H)continue;
    let ok=true; for(const room of rshuf(r,Object.keys(ROOM_PIECES))){ if(!placeRoom(r,H,room)){ok=false;break;} }
    if(!ok||!finish(H))continue;
    H.seed=seed; H.tries=tries; return H;
  }
  return null;
}

function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^zh[-_]TW$/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang)&&!/^(yue|zh[-_]hk)/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';if(VOICE)u.voice=VOICE;u.rate=RATE_VALUE[S.rate]||0.65;speechSynthesis.speak(u);}catch(e){}
}

// ============ 音效 ============
let AC=null;
const SFX={ok:[[660,0,.09],[880,.09,.16]],bad:[[220,0,.12,'sawtooth'],[165,.12,.2,'sawtooth']],done:[[523,0,.08],[659,.08,.08],[784,.16,.18]],win:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.3]],lose:[[392,0,.18],[330,.18,.18],[262,.36,.36]]};
function sfx(k){
  if(S.sound==='off')return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume();
    const now=AC.currentTime;
    SFX[k].forEach(([f,t0,d,ty])=>{ const o=AC.createOscillator(),v=AC.createGain(); o.type=ty||'sine'; o.frequency.value=f;
      v.gain.setValueAtTime(0,now+t0); v.gain.linearRampToValueAtTime(ty?.12:.2,now+t0+.015); v.gain.exponentialRampToValueAtTime(.001,now+t0+d);
      o.connect(v);v.connect(AC.destination);o.start(now+t0);o.stop(now+t0+d+.02); });
  }catch(e){}
}

// ============ 出題 ============
function distract(itemId,lv){
  const it=ITEM[itemId];
  let pool=shuffle(ITEMS.filter(x=>x.x!==it.x));
  const out=[],cats=new Set();
  for(const x of pool){ if(cats.has(x.x))continue;cats.add(x.x); out.push(x.id); if(out.length===2)break; }
  return shuffle([itemId,...out]);
}
function genQuestions(lv){
  let groups;
  if(lv<=2) groups=shuffle(STOPS_A).slice(0,LEVEL_Q[lv]).map(s=>[s]);
  else{   // 第 3 級由易到難：旁邊／前面／後面 → 上面／下面／裡面 → 左邊／右邊
    const tiers=[[['side','front','back'],3],[['up','down','in'],4],[['left','right'],LEVEL_Q[lv]-7]];
    const used=new Set(); groups=[];
    tiers.forEach(([ps,n])=>{
      const pick=shuffle(STOPS_B.filter(s=>ps.includes(s.p)&&!used.has(s))).slice(0,n);
      pick.forEach(s=>{used.add(s);groups.push([s]);});
    });
    shuffle(STOPS_B.filter(s=>!used.has(s))).slice(0,Math.max(0,LEVEL_Q[lv]-groups.length)).forEach(s=>groups.push([s]));
  }
  return groups.map(gp=>({stops:gp.map(s=>({...s,ch:distract(s.i,lv)})),...freshQ()}));
}
const freshQ=()=>({si:0,hadMiss:false,usedHint:false,peeked:false,pts:0,t0:Date.now()});
function stopSegs(st,lv,first){
  const s=[];
  if(!first)s.push(PS.comma,PS.again); else s.push(lv===1?PS.go:PS.goto);
  s.push(ROOM[st.r]);
  if(lv>=2)s.push(PS.de,FURN[st.f]);
  if(lv>=3)s.push(POS[st.p]);
  s.push(PS.get,ITEM[st.i]);
  return s;
}
function sentenceSegs(q){let o=[];q.stops.forEach((st,i)=>{o=o.concat(stopSegs(st,G.level,i===0));});return o;}
const sentenceText=q=>sentenceSegs(q).map(s=>s.tw).join('');
function esClause(st,lv){
  let s=`a ${ROOM[st.r].es} a buscar ${ITEM[st.i].es}`;
  if(lv===2)s+=` en ${FURN[st.f].es}`; if(lv>=3)s+=` ${POS[st.p].es} ${FURN[st.f].es}`; return s;
}
function enClause(st,lv){
  let s=`to the ${ROOM[st.r].en} to get the ${ITEM[st.i].en}`;
  if(lv===2)s+=` from the ${FURN[st.f].en}`; if(lv>=3)s+=` ${POS[st.p].en} the ${FURN[st.f].en}`; return s;
}
function transText(q){
  if(!trKey())return '';
  const lv=G.level, c=q.stops;
  if(S.lang==='es') return ('Voy '+esClause(c[0],lv)+(c[1]?', y luego '+esClause(c[1],lv):'')+'.').replace(/\ba el\b/g,'al').replace(/\bde el\b/g,'del');
  return "I'm going "+enClause(c[0],lv)+(c[1]?', then '+enClause(c[1],lv):'')+'.';
}

// ============ 遊戲狀態 ============
const curQ=()=>G.qs[G.qi];
const curStop=()=>curQ().stops[curQ().si];
let PL={x:0,y:0,dir:'down',moving:null,path:[],judge:false,goal:null,step:0};
const isWalkable=(H,x,y)=>inB(x,y)&&H.grid[y][x].k!=='wall'&&!H.occ[y][x];

function startLevel(n){
  let H=null; const forced=QS.get('seed');
  for(let i=0;i<8&&!H;i++) H=genHouse(forced&&i===0?+forced:(Math.random()*4294967296)>>>0);
  G={level:n,listen:!!S.listen,house:H,qs:genQuestions(n),qi:0,hearts:3,score:0,combo:0,hints:3,
     stat:{first:0,done:0},review:new Map(),phase:'go',stepWrong:false,stepHint:false,dead:new Set(),flash:null,saved:false,res:null,neutral:0};
  PL={x:H.start.x,y:H.start.y,dir:'right',moving:null,path:[],judge:false,goal:null,step:0};
  screen='game'; mountGame(); bakeHouse(); beginQuestion(true);
  try{ window.HGPlays && HGPlays.start('L'+n, NAME); }catch(e){}
}
function beginQuestion(first){
  const q=curQ(); Object.assign(q,freshQ());
  G.phase='go'; G.stepWrong=false; G.stepHint=false; G.dead=new Set(); G.flash=null;
  updateAll();
  setTimeout(()=>{ if(G&&curQ()===q)speak(sentenceText(q)); },first?400:200);
}
function setPhase(p){G.phase=p;G.stepWrong=false;G.stepHint=false;G.dead=new Set();G.flash=null;updateAll();}
const stepPts=(done)=>{ // 這一步能拿幾分
  const base=done; return G.stepWrong?0:(G.stepHint?Math.floor(base/2):base);
};
function countStep(ok){G.stat.done++; if(ok)G.stat.first++;}

// 判定：走到定點
function arrive(){
  if(!G||G.phase!=='go'||PL.moving)return;
  const q=curQ(), st=curStop(), lv=G.level, H=G.house, cell=H.grid[PL.y][PL.x];
  const adj=H.spotIndex[PL.x+','+PL.y]||[];
  if(lv===1){
    if(!cell.room)return neutral();
    if(cell.room===st.r) return okArrive(10,'item');
    return badArrive(ROOM[cell.room].tw,ROOM[cell.room].es,ROOM[cell.room].en,{type:'room',id:st.r});
  }
  if(!adj.length)return neutral();
  const walk=WALK_POS.includes(st.p);
  const strict=lv>=3&&walk;
  const match=adj.some(a=>a.f===st.f&&(!strict||a.pos===st.p));
  if(match){
    if(lv===2) return okArrive(20,'item');
    return strict?okArrive(30,'item'):okArrive(20,'pos');
  }
  const a=adj.find(x=>x.f===st.f)||adj[0], F=FURN[a.f], p=POS[a.pos];
  if(lv===2) return badArrive(F.tw,F.es,F.en,{type:'furn',id:st.f});
  return badArrive(F.tw+p.tw, p.es+' '+F.es, p.en+' the '+F.en, {type:'furn',id:st.f});
}
function neutral(){ if(G.neutral++<3&&G.level>=2) toast(t('nothing')); }
function revealPlace(){
  const st=curStop();
  if(G.level===1){ G.revealRoom=st.r; buildLabels(); setTimeout(()=>{ if(G){G.revealRoom=null;buildLabels();} },2400); }
  else showTag(st.f,2400);
}
function okArrive(pts,next){
  const q=curQ(); q.pts+=stepPts(pts); countStep(!G.stepWrong); revealPlace();
  toast('✓'); sfx('ok');
  G.busy=true; setTimeout(()=>{ if(!G)return; G.busy=false; setPhase(next); },350);
}
function badArrive(zh,es,en,rev){
  const q=curQ(); loseHeart(rev);
  const lang=S.lang==='en'?en:es;
  toast('✗ '+t('here')+' '+zh+(S.lang==='zh'?'':' · '+lang.replace(/\bde el\b/g,'del')),true);
}
function loseHeart(rev){
  const q=curQ(); G.stepWrong=true; q.hadMiss=true; G.hearts--; G.combo=0; sfx('bad');
  if(rev){const key=rev.type+':'+rev.id; if(!G.review.has(key))G.review.set(key,rev);}
  updateTop(); shakeMap();
  if(G.hearts<=0){G.busy=true;setTimeout(()=>endGame(false),900);}
}
function choosePos(id){
  if(!G||G.phase!=='pos'||G.busy||G.dead.has(id))return;
  const st=curStop(), q=curQ();
  if(id===st.p){ sfx('ok'); q.pts+=stepPts(10); countStep(!G.stepWrong); G.flash=id; updateSheet(); G.busy=true; setTimeout(()=>{if(!G)return;G.busy=false;setPhase('item');},350); }
  else{ G.dead.add(id); loseHeart({type:'pos',id:st.p}); updateSheet(); }
}
function chooseItem(id){
  if(!G||G.phase!=='item'||G.busy||G.dead.has(id))return;
  const st=curStop(), q=curQ();
  if(id===st.i){
    sfx('ok'); q.pts+=stepPts(10); countStep(!G.stepWrong); G.flash=id; updateSheet(); G.busy=true;
    setTimeout(()=>{ if(!G)return; G.busy=false; q.si++; if(q.si>=q.stops.length)finishQuestion(); else {setPhase('go');speak(sentenceText(q));} },420);
  }else{ G.dead.add(id); loseHeart({type:'item',id:st.i}); updateSheet(); }
}
function finishQuestion(){
  const q=curQ(), n=q.stops.length, lv=G.level;
  const limit=n*(lv===1?16:lv===2?20:26), secs=(Date.now()-q.t0)/1000;
  let sub=q.pts, bonus=0;
  if(!q.hadMiss&&!q.usedHint&&secs<=limit){bonus=5;sub+=bonus;}
  if(!q.hadMiss)G.combo++; else G.combo=0;
  const mult=G.combo>=5?2:G.combo>=3?1.5:1, lm=(G.listen&&!q.peeked)?1.5:1;
  const gain=Math.round(sub*mult*lm);
  G.score+=gain; G.busy=true; G.phase='busy';
  let msg='+'+gain; if(mult>1)msg+='  ×'+mult+' '+t('combo'); if(bonus)msg+='  ⚡';
  toast(msg); sfx('done'); G.qi++; updateAll();
  if(G.qi>=G.qs.length)setTimeout(()=>endGame(true),900); else setTimeout(()=>{G.busy=false;beginQuestion(false);},900);
}
function endGame(done){
  if(!G)return;
  const acc=G.stat.done?G.stat.first/G.stat.done:0;
  let st=0; if(done)st=acc>=.9?3:acc>=.7?2:1;
  G.res={done,acc,stars:st,score:G.score};
  try{ window.HGPlays && HGPlays.end({score:G.score, name:NAME}); }catch(e){}
  const b=P0.best[G.level]||{stars:0,score:0};
  if(st>b.stars)b.stars=st; if(G.score>b.score)b.score=G.score; P0.best[G.level]=b;
  if(st>=2&&G.level<3&&P0.unlocked<G.level+1)P0.unlocked=G.level+1;
  setTimeout(()=>sfx(done?'win':'lose'),250); save(); screen='end'; G.busy=false; try{speechSynthesis.cancel()}catch(e){}
  render(); loadBoard();
}
function useHint(){
  if(!G||G.hints<=0||G.stepHint||G.busy||(G.phase!=='go'&&G.phase!=='pos'&&G.phase!=='item'))return;
  G.hints--; G.stepHint=true; curQ().usedHint=true; updateAll();
  if(G.level>=2&&G.phase==='go')showTag(curStop().f,5000);
}

// ============ 走路 ============
function bfs(H,sx,sy,tx,ty){
  if(!isWalkable(H,tx,ty))return null;
  const q=[[sx,sy]], prev={[sx+','+sy]:null};
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx&&y===ty){ const out=[]; let k=x+','+y; while(prev[k]){ const [a,b]=k.split(',').map(Number); out.unshift({x:a,y:b}); k=prev[k]; } return out; }
    for(const d of Object.values(DIRV)){
      const nx=x+d[0],ny=y+d[1],nk=nx+','+ny;
      if(isWalkable(H,nx,ny)&&!(nk in prev)){prev[nk]=x+','+y;q.push([nx,ny]);}
    }
  } return null;
}
function standTile(H,fid,from){
  const sp=H.spots[fid]; let lists;
  if(G.level>=3) lists=[sp.front,sp.side.concat(sp.back)]; else lists=[sp.front.concat(sp.side,sp.back)];
  for(const L of lists){
    let best=null,bl=1e9;
    for(const t0 of L){ const p=bfs(H,from.x,from.y,t0.x,t0.y); if(p&&p.length<bl){bl=p.length;best=t0;} }
    if(best)return best;
  } return null;
}
function tapTile(tx,ty){
  if(!G||G.phase!=='go'||G.busy||screen!=='game')return;
  const H=G.house; if(!inB(tx,ty))return;
  const from=PL.moving?PL.moving.to:{x:PL.x,y:PL.y};
  let goal=null; const f=H.occ[ty][tx];
  if(f){ goal=standTile(H,f,from); }
  else if(H.grid[ty][tx].k!=='wall'){ goal={x:tx,y:ty}; }
  if(!goal)return;
  const p=bfs(H,from.x,from.y,goal.x,goal.y); if(!p)return;
  PL.path=p; PL.judge=true; PL.goal={x:goal.x,y:goal.y};
}
function stepPlayer(now){
  if(G.phase==='busy'&&false)return;
  if(!PL.moving&&PL.path.length&&!G.busy){
    const n=PL.path[0]; PL.dir=n.x>PL.x?'right':n.x<PL.x?'left':n.y>PL.y?'down':'up';
    PL.moving={from:{x:PL.x,y:PL.y},to:{x:n.x,y:n.y},t0:now}; PL.path.shift();
  }
  if(PL.moving&&now-PL.moving.t0>=STEP_MS){ PL.x=PL.moving.to.x; PL.y=PL.moving.to.y; PL.moving=null; PL.step++; }
  if(!PL.moving&&!PL.path.length&&PL.judge){ PL.judge=false; PL.goal=null; arrive(); }
}

// ============ 畫面（遊戲殼） ============
const app=document.getElementById('app');
function mountGame(){
  app.innerHTML=`<div class="top" id="top"></div><div class="card sent" id="sent"></div><div class="tools" id="tools"></div><div class="stepname" id="stepname"></div>
  <div id="wrap"><canvas id="cv" width="${COLS*T}" height="${ROWS*T}"></canvas><div id="labels"></div><div id="tag"></div><div id="sheet"></div></div>`;
  cv=document.getElementById('cv'); g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
  cv.addEventListener('pointerdown',e=>{
    const r=cv.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width*COLS*T, py=((e.clientY-r.top)/r.height*cv.height)+camY;
    const tx=Math.floor(px/T), ty=Math.floor(py/T);
    if(G&&!PL.moving&&tx===PL.x&&ty===PL.y&&G.phase==='go'){ arrive(); return; }   // 點自己 = 在這裡確認
    tapTile(tx,ty);
  });
  camY=0; camSnap=true;
}
function updateAll(){ if(screen!=='game'||!G)return; updateTop(); updateSent(); updateTools(); updateSheet(); buildLabels(); fitView(); }
function updateTop(){
  const el=document.getElementById('top'); if(!el)return;
  el.innerHTML=`<button data-a="quit">✕</button><div class="prog">${esc(t('q',{a:Math.min(G.qi+1,G.qs.length),b:G.qs.length}))}</div>
   <div class="hearts">${'♥'.repeat(Math.max(G.hearts,0))+'♡'.repeat(Math.max(3-G.hearts,0))}</div><div class="score">${G.score}</div>`;
}
function updateSent(){
  const el=document.getElementById('sent'); if(!el||G.qi>=G.qs.length)return;
  const q=curQ(), hidden=G.listen&&!q.peeked, segs=sentenceSegs(q), tt=hidden?'':transText(q);
  el.style.minHeight=112+'px';
  el.innerHTML=hidden?`<div class="hid">🎧 ${esc(t('hiddenS'))}</div>`:`<div class="zh">${segs.map(R).join('')}</div>${tt?`<div class="trl">${esc(tt)}</div>`:''}`;
}
function updateTools(){
  const el=document.getElementById('tools'); if(!el||G.qi>=G.qs.length)return; const q=curQ();
  el.innerHTML=`<button data-a="replay">🔊 ${esc(t('replay'))}</button>
   <button data-a="hint" ${(G.hints<=0||G.stepHint||G.busy)?'disabled':''}>💡 ${esc(t('hint'))} ${G.hints}</button>
   ${G.listen&&!q.peeked?`<button data-a="peek">👁 ${esc(t('peek'))}</button>`:''}`;
  const sn=document.getElementById('stepname'); if(sn)sn.textContent=G.phase==='go'?t('ph_go')+((G.level>=3&&['left','right'].includes(curStop().p))?'　('+t('lrnote')+')':''):G.phase==='pos'?t('ph_pos'):G.phase==='item'?t('ph_item'):'';
  const comboTxt=G.combo>=2?'🔥 '+t('combo')+' '+G.combo:''; if(sn&&comboTxt)sn.textContent+='　'+comboTxt;
}
function updateSheet(){
  const el=document.getElementById('sheet'); if(!el)return;
  if(G.qi>=G.qs.length||(G.phase!=='pos'&&G.phase!=='item')){el.innerHTML='';el.className='';return;}
  const st=curStop(), F=FURN[st.f], cls=(id,tg)=>(G.dead.has(id)?' ng':'')+(G.flash===id?' ok':'')+((G.stepHint&&id===tg&&!G.flash)?' hint':'');
  const head=`<div class="sh-h">${F.ic} ${R(F)}</div>`;
  if(G.phase==='pos'){
    el.innerHTML=head+`<div class="posg">${POSS.filter(p=>CHOOSE_POS.includes(p.id)).map(p=>`<button class="pb${cls(p.id,st.p)}" data-a="pos" data-v="${p.id}" ${G.dead.has(p.id)?'disabled':''}><span class="pic">${p.ic}</span><span class="lab">${R(p)}</span>${tr(p)}</button>`).join('')}</div>`;
  }else{
    el.innerHTML=head+`<div class="itg">${st.ch.map(id=>{const it=ITEM[id];return `<button class="item${cls(id,st.i)}" data-a="item" data-v="${id}" ${G.dead.has(id)?'disabled':''}><span class="iic">${it.ic}</span><span class="lab">${R(it)}</span>${tr(it)}</button>`;}).join('')}</div>`;
  }
  el.className='show';
}
function toast(m,bad){const el=document.getElementById('toast');el.textContent=m;el.className='';void el.offsetWidth;el.className='show'+(bad?' bad':'');}
function shakeMap(){const el=document.getElementById('wrap');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}}
function render(){
  document.documentElement.lang=S.lang==='zh'?(isSimp()?'zh-Hans':'zh-Hant'):S.lang; updateVoiceHint();

  const r=G.res, ok=r.done;

function fitView(){

  const rows=Math.max(12,Math.min(ROWS,Math.floor(avail/(T*sc))));

let _last=0;
function tick(now){
  requestAnimationFrame(tick);
  if(screen!=='game'||!G||!cv)return;
  if(now-_last<30)return; const dt=Math.min(.05,(now-(_last||now))/1000); _last=now;
  stepPlayer(now);
  // 鏡頭
  const VH=cv.height, py=(PL.moving?PL.moving.from.y+(PL.moving.to.y-PL.moving.from.y)*Math.min(1,(now-PL.moving.t0)/STEP_MS):PL.y)*T;
  const shEl=document.getElementById('sheet'), shPx=(shEl&&shEl.className==='show')?shEl.offsetHeight/scale:0;   // 選單蓋住下方時，鏡頭往上讓小人看得到
  let c=py+T/2, view=VH-shPx;
  if(G&&screen==='game'&&G.phase==='go'&&G.stepHint&&G.qi<G.qs.length){
    const ht=hintTiles(); if(ht.length){ const ys=ht.map(p=>p.y*T+T/2), hc=(Math.min(...ys)+Math.max(...ys))/2; c=(Math.abs(hc-c)+T*3<view)?(hc+c)/2:hc; }
  }
  const want=Math.max(0,Math.min(ROWS*T-VH,c-view/2));
  if(camSnap){camY=Math.round(want);camSnap=false;} else camY+=(want-camY)*Math.min(1,dt*6);
  camY=Math.round(camY);
  draw(now); positionLabels(); positionTag();
}

function hintTiles(){
  const st=curStop(), H=G.house, lv=G.level;
  if(lv===1){const a=H.rects[st.r],o=[];for(let y=a.y0;y<=a.y1;y++)for(let x=a.x0;x<=a.x1;x++)o.push({x,y});return o;}
  const sp=H.spots[st.f];
  if(lv>=3&&WALK_POS.includes(st.p))return sp[st.p];
  return sp.front.concat(sp.side,sp.back);
}
function draw(now){

  g.drawImage(bg,0,camY,cv.width,VH,0,0,cv.width,VH);

let FB=null,FBTried=false;
async function initFB(){
  if(FBTried||!FIREBASE_CONFIG)return FB; FBTried=true;
  try{
    const [a,f,au]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js')]);
    const app2=a.initializeApp(FIREBASE_CONFIG,'homefetch');
    let uid=null; try{uid=(await au.signInAnonymously(au.getAuth(app2))).user.uid;}catch(e){console.warn('匿名登入失敗',e);}
    FB={db:f.getFirestore(app2),f,uid};
  }catch(e){console.warn(e);FB=null;}
  return FB;
}
const Board={
  async top(lv){
    const fb=await initFB();

    try{return {remote:false,rows:JSON.parse(localStorage.getItem('hfm_board_L'+lv)||'[]')};}catch(e){return {remote:false,rows:[]};}
  },

    if(fb&&fb.uid){try{
      const {doc,getDoc,setDoc,serverTimestamp}=fb.f, ref=doc(fb.db,'homefetchmap_L'+lv,fb.uid), snap=await getDoc(ref);
      const sc=Math.max(0,Math.min(20000,Math.round(score)));

        const keep=snap.exists()&&(snap.data().score||0)>=sc;

      return;
    }catch(e){console.warn(e);}}
    try{const k='hfm_board_L'+lv;const a=JSON.parse(localStorage.getItem(k)||'[]');a.push(row);a.sort((x,y)=>y.score-x.score);localStorage.setItem(k,JSON.stringify(a.slice(0,10)));}catch(e){}
  }
};
async function loadBoard(){
  const el=document.getElementById('board'); if(!el||!G)return;
  el.innerHTML=`<div class="small">${t('loading')}</div>`;
  const {remote,rows}=await Board.top(G.level), el2=document.getElementById('board'); if(!el2)return;
  el2.innerHTML=rows.length?`<ol>${rows.map(r=>`<li><span>${esc(r.name||'?')}${r.listen?' 🎧':''}</span><span>${r.score}</span></li>`).join('')}</ol>`:`<div class="small">${t('nobody')}</div>`;
  if(!remote&&!FIREBASE_CONFIG)el2.insertAdjacentHTML('beforeend',`<div class="small" style="margin-top:6px">${t('localnote')}</div>`);
}

// ============ 事件 ============
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'levels':screen='levels';G=null;render();break;
    case 'home':screen='home';render();break;
    case 'settings':openSettings();break;
    case 'closeSet':closeSettings();break;
    case 'set':{S[b.dataset.k]=v;if(SET_OPTS[b.dataset.k])writeShared(S);else save();document.getElementById('modal').innerHTML=settingsHTML();if(screen!=='game')render();else{updateSent();updateTools();updateSheet();buildLabels();}break;}
    case 'toggleListen':S.listen=!S.listen;save();render();break;
    case 'lv':if(QS.get('unlock')||P0.unlocked>=+v)startLevel(+v);break;
    case 'quit':screen='levels';G=null;try{speechSynthesis.cancel()}catch(x){}render();break;
    case 'pos':choosePos(v);break;
    case 'item':chooseItem(v);break;
    case 'replay':if(G&&screen==='game')speak(sentenceText(curQ()));break;
    case 'hint':useHint();break;
    case 'peek':{curQ().peeked=true;updateSent();updateTools();break;}
    case 'saveScore':{
      const inp=document.getElementById('nm');const nm=((inp&&inp.value)||'').trim()||'Player';
      NAME=nm;save();G.saved=true;
      Board.submit(G.level,nm,G.res.score,G.listen).then(()=>{if(screen==='end'){render();loadBoard();}});
      break;
    }
  }
});
addEventListener('keydown',e=>{
  if(screen!=='game'||!G||G.phase!=='go'||G.busy||e.target.tagName==='INPUT')return;
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){ e.preventDefault(); if(PL.moving)return; const nx=PL.x+m[0],ny=PL.y+m[1]; if(isWalkable(G.house,nx,ny)){PL.path=[{x:nx,y:ny}];PL.judge=false;} return; }
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); arrive(); }
});

// ============ 跨分頁同步 ============
addEventListener('storage',e=>{
  if(e.key!==null&&e.key!==SETTINGS_KEY)return;
  Object.assign(S,readShared());
  const m=document.getElementById('modal'); if(m&&m.className==='show')m.innerHTML=settingsHTML();
  if(screen==='game'&&G){updateSent();updateTools();updateSheet();buildLabels();}else render();
  updateVoiceHint();
});

// ============ 沒有中文語音的提醒 ============
let voiceMissing=false, voiceDismissed=false;
function updateVoiceHint(){
  const el=document.getElementById('voice-hint'); if(!el)return;
  document.getElementById('voice-hint-txt').textContent=t('voiceHint');
  el.className=(voiceMissing&&!voiceDismissed)?'show':'';
}
document.getElementById('voice-hint-close').addEventListener('click',()=>{voiceDismissed=true;updateVoiceHint();});
(function(){
  if(!('speechSynthesis' in window)){voiceMissing=true;updateVoiceHint();return;}
  setTimeout(()=>{pickVoice();voiceMissing=!VOICE;updateVoiceHint();},2000);
  speechSynthesis.onvoiceschanged=()=>{pickVoice();if(VOICE){voiceMissing=false;updateVoiceHint();}};
})();

window.__hf={get G(){return G},get S(){return S},get P0(){return P0},get PL(){return PL},tapTile,arrive,choosePos,chooseItem,startLevel,curStop,curQ,get STEP(){return STEP_MS},setStep:v=>{STEP_MS=v;},WALK_POS,standTile,bfs};
render();

<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'agarrar';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() })
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
